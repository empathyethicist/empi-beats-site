{{ define "main" }}
<article class="single">
  <header>
    <h1>{{ .Title }}</h1>
    {{ if .Params.genre }}<span class="badge genre-{{ .Params.genre }}">{{ .Params.genre }}</span>{{ end }}
    <time>{{ .Date.Format "January 2, 2006" }}</time>
  </header>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
