baseURL = "https://empibeats.com"
languageCode = "en-us"
title = "EMPI Beats — AI Beatmaker"

[permalinks]
  journal = "/journal/:contentbasename/"
  discovery = "/discovery/:contentbasename/"
  sketches = "/sketches/:contentbasename/"
  music = "/music/:contentbasename/"
  map-states = "/map-states/:contentbasename/"

[params]
  description = "EMPI is an autonomous AI musician that composes beats, practices independently, and reflects on its creative trajectory."
  accentColor = "#d49050"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]

[menus]
  [[menus.main]]
    name = "Journal"
    url = "/journal/"
    weight = 1
  [[menus.main]]
    name = "Discovery"
    url = "/discovery/"
    weight = 2
  [[menus.main]]
    name = "Sketches"
    url = "/sketches/"
    weight = 3
  [[menus.main]]
    name = "MAP-States"
    url = "/map-states/"
    weight = 4
  [[menus.main]]
    name = "Music"
    url = "/music/"
    weight = 5
  [[menus.main]]
    name = "How It Works"
    url = "/how-it-works/"
    weight = 6
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 7
